name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black ruff pytest pytest-cov
    
    - name: Run Black
      run: black --check src/ scripts/ demo/ tests/
    
    - name: Run Ruff
      run: ruff check src/ scripts/ demo/ tests/
    
    - name: Run type checking
      run: |
        pip install mypy
        mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  model-export:
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test model training and export
      run: |
        python scripts/train_evaluate.py --config configs/default.yaml --output-dir test_outputs
    
    - name: Verify exported models
      run: |
        ls -la test_outputs/
        test -f test_outputs/model.onnx || echo "ONNX model not found"
        test -f test_outputs/results.json || echo "Results file not found"
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-outputs
        path: test_outputs/

  demo-test:
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test Streamlit app
      run: |
        python -c "import streamlit; print('Streamlit import successful')"
        python -c "from demo.app import main; print('Demo app import successful')"
    
    - name: Test demo components
      run: |
        python -c "
        import sys
        sys.path.append('src')
        from models.anomaly_detector import AnomalyDetector
        from pipelines.data_pipeline import SensorSimulator
        from utils.evaluation import AnomalyDetectionMetrics
        print('All demo components imported successfully')
        "

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: bandit -r src/ scripts/ demo/ -f json -o bandit-report.json || true
    
    - name: Run Safety check
      run: safety check --json --output safety-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build-docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme
    
    - name: Build documentation
      run: |
        # Create basic documentation structure
        mkdir -p docs/
        echo "# IoT Anomaly Detection Documentation" > docs/README.md
        echo "This is a placeholder for future documentation." >> docs/README.md
    
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/

  performance-benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run performance benchmarks
      run: |
        python -c "
        import time
        import numpy as np
        import sys
        sys.path.append('src')
        from models.anomaly_detector import AnomalyDetector
        
        # Benchmark model training
        start_time = time.time()
        detector = AnomalyDetector(model_type='tensorflow', input_dim=1, hidden_dims=[4,2])
        data = np.random.normal(22.5, 1.0, (1000, 1))
        detector.fit(data)
        training_time = time.time() - start_time
        
        # Benchmark inference
        start_time = time.time()
        test_data = np.random.normal(22.5, 1.0, (100, 1))
        detector.predict(test_data)
        inference_time = time.time() - start_time
        
        print(f'Training time: {training_time:.3f}s')
        print(f'Inference time: {inference_time:.3f}s')
        print(f'Inference throughput: {100/inference_time:.1f} samples/s')
        "
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: benchmark-results.txt
